[package]
name = "agent-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Runnable agent pipeline example with fake handlers and crash injection"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-pipeline"
path = "src/main.rs"

[dependencies]
dmt = { path = "../../crates/dmt", features = ["sqlite", "test-faults"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[dev-dependencies]
dmt-core = { path = "../../crates/dmt-core", features = ["fixtures"] }

[lints]
workspace = true

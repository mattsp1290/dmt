[workspace]
members = ["crates/*", "examples/agent-pipeline", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
statig = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = "1"
tokio-util = "0.7"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
tracing = "0.1"
tempfile = "3"
proptest = "1"
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
# OpenTelemetry 0.32 / SDK 0.32.1 / Datadog 0.5.2: bump the chain together.
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "fmt", "env-filter", "json", "std"] }
